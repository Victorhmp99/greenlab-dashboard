<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Green Lab · Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--g:#22C55E;--dark:#0F172A;--bg:#060E1A;--bd:#1E293B;--sl:#475569;--mid:#94A3B8;--red:#EF4444;--yel:#F59E0B;--w:#FFFFFF}
html,body{background:var(--bg);color:var(--w);font-family:'DM Sans',system-ui,sans-serif;-webkit-text-size-adjust:100%}
#app{display:flex;flex-direction:column;min-height:100vh}

/* HEADER */
.header{background:var(--dark);border-bottom:1px solid var(--bd);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header-left{display:flex;align-items:center;gap:10px}
.logo{width:52px;height:36px;background:#000;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0}.logo img{width:100%;height:100%;object-fit:contain;padding:3px}
.header h1{font-size:15px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.header p{font-size:10px;color:var(--sl);line-height:1.2}
.status{display:flex;align-items:center;gap:5px;flex-direction:column;align-items:flex-end}
.live{display:flex;align-items:center;gap:5px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--g);box-shadow:0 0 6px var(--g);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.live span{color:var(--g);font-size:10px;font-weight:700}
#last-update{font-size:9px;color:var(--sl)}

/* TABS */
.tabs{background:var(--dark);border-bottom:1px solid var(--bd);display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:none;cursor:pointer;padding:11px 16px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;color:var(--sl);white-space:nowrap;flex-shrink:0;border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
.tab.active{color:var(--g);border-bottom-color:var(--g)}

/* CONTENT */
.content{padding:14px;max-width:680px;margin:0 auto;width:100%}
.section{display:none;flex-direction:column;gap:14px}
.section.active{display:flex}

/* CARD */
.card{background:var(--dark);border:1px solid var(--bd);border-radius:14px;padding:16px;overflow:hidden}
.sec{font-size:10px;font-weight:700;color:var(--mid);text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--dark);border:1px solid var(--bd);border-radius:14px;padding:14px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;right:0;width:48px;height:48px;background:var(--accent,#fff1);border-radius:0 14px 0 48px}
.kpi-label{font-size:9px;font-weight:700;color:var(--mid);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi-value{font-family:'DM Mono',monospace;font-size:17px;font-weight:700;line-height:1.15;color:var(--accent-text,var(--w));word-break:break-word}
.kpi-sub{font-size:10px;color:var(--sl);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* PROGRESS */
.prog{margin-bottom:14px}
.prog:last-child{margin-bottom:0}
.prog-header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:5px}
.prog-label{font-size:12px;color:var(--mid);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.prog-value{font-size:12px;font-weight:700;color:var(--w);white-space:nowrap;flex-shrink:0}
.prog-track{background:var(--bd);border-radius:99px;height:7px;overflow:hidden}
.prog-fill{height:100%;border-radius:99px;transition:width .7s cubic-bezier(.4,0,.2,1)}
.prog-footer{display:flex;justify-content:space-between;margin-top:3px}
.prog-meta{font-size:10px;color:var(--sl)}

/* TX */
.tx{background:#0A1220;border-radius:10px;padding:11px 12px;margin-bottom:8px}
.tx:last-child{margin-bottom:0}
.tx-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.tx-desc{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.tx-val{font-size:13px;font-weight:800;white-space:nowrap;flex-shrink:0}
.tx-bottom{display:flex;gap:7px;align-items:center}
.badge{font-size:9px;font-weight:700;border-radius:5px;padding:1px 7px;white-space:nowrap}
.tx-date{font-size:10px;color:var(--sl)}

/* ALERT */
.alert{border-radius:10px;padding:12px;margin-bottom:9px}
.alert:last-child{margin-bottom:0}
.alert-title{font-size:13px;font-weight:700;margin-bottom:3px}
.alert-msg{font-size:12px;color:var(--mid);line-height:1.5}

/* INVEST */
.inv-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.inv-item:last-child{border-bottom:none;padding-bottom:0}
.inv-left{display:flex;align-items:center;gap:9px}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.inv-name{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}
.inv-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.inv-val{font-size:13px;font-weight:700}

/* FOLHA */
.folha-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.folha-item:last-child{border-bottom:none}
.folha-nome{font-size:14px;font-weight:700;margin-bottom:3px}
.folha-cargo{font-size:10px;font-weight:700;background:#3B82F622;color:#3B82F6;border-radius:5px;padding:1px 7px;display:inline-block}
.folha-sal{font-size:16px;font-weight:800;color:var(--g)}

/* CHART */
.chart-wrap{position:relative;width:100%}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.legend-item{display:flex;align-items:center;gap:5px}
.legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.legend-label{font-size:11px;color:var(--mid)}

/* LOADING */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:40px 0}
.spinner{width:32px;height:32px;border:3px solid var(--bd);border-top-color:var(--g);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{font-size:13px;color:var(--mid)}

/* ERRO */
.erro{background:#EF444415;border:1px solid #EF444430;border-radius:12px;padding:16px;text-align:center}
.erro p{font-size:13px;color:#EF4444;line-height:1.6}
.erro code{font-size:10px;color:var(--mid);display:block;margin-top:8px;word-break:break-all}

/* EMPTY */
.empty{text-align:center;padding:20px;color:var(--sl);font-size:13px}
</style>
</head>

    <button class="tab" onclick="showTab('receitas',event)">Receitas</button>
    <button class="tab" onclick="showTab('despesas',event)">Despesas</button>
    <button class="tab" onclick="showTab('investimentos',event)">Investimentos</button>
  </nav>

  <main class="content">
    <div id="tab-overview"      class="section active"><div class="loading"><div class="spinner"></div><p>Carregando dados...</p></div></div>
    <div id="tab-receitas"      class="section"></div>
    <div id="tab-despesas"      class="section"></div>
    <div id="tab-investimentos" class="section"></div>
  </main>
</div>

<script>
// ══════════════════════════════════════════════════════════════════
// ⚠️  COLE SUA URL AQUI depois de publicar o Apps Script
// ══════════════════════════════════════════════════════════════════
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwGqBwx4cmZ-RfW0a0iWGGtAIDDKEMWBKmpDhQ9jamrHtbY6jeUkW5_8VtOU4ehB123/exec';

// Intervalo de atualização (ms) — padrão 5 minutos
var INTERVALO = 5 * 60 * 1000;

// ── ESTADO ───────────────────────────────────────────────────────
var dadosGlobais = null;
var tabAtual     = 'overview';
var charts       = {};
var PIE_CORES    = ['#22C55E','#3B82F6','#F59E0B','#EC4899','#8B5CF6','#06B6D4','#EF4444','#84CC16','#F97316'];

// ── HELPERS ──────────────────────────────────────────────────────
function brl(v) {
  return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:0}).format(v||0);
}
function pct(r,p) { return p > 0 ? Math.min(Math.round((r/p)*100),100) : (r > 0 ? 100 : 0); }
function corProg(r,p) {
  if (r > p && p > 0) return '#EF4444';
  var p2 = pct(r,p);
  return p2 >= 70 ? '#22C55E' : '#F59E0B';
}
function el(id) { return document.getElementById(id); }

// ── FETCH DADOS ──────────────────────────────────────────────────
function carregarDados() {
  if (!SCRIPT_URL || SCRIPT_URL === 'COLE_SUA_URL_AQUI') {
    renderErroURL();
    return;
  }
  fetch(SCRIPT_URL + '?t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(dados){
      dadosGlobais = dados;
      el('last-update').textContent = 'Atualizado: ' + dados.atualizado;
      destruirCharts();
      renderTodos();
    })
    .catch(function(err){
      el('tab-overview').innerHTML = erroHTML('Falha ao carregar dados.', err.message);
    });
}

function destruirCharts() {
  Object.keys(charts).forEach(function(k){ if(charts[k]) charts[k].destroy(); });
  charts = {};
}

// ── TABS ─────────────────────────────────────────────────────────
function showTab(id, ev) {
  document.querySelectorAll('.section').forEach(function(s){ s.classList.remove('active'); });
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
  el('tab-'+id).classList.add('active');
  if (ev) ev.target.classList.add('active');
  tabAtual = id;
  if (dadosGlobais) renderTab(id);
}

function renderTodos() {
  renderTab('overview');
  renderTab('receitas');
  renderTab('despesas');
  renderTab('investimentos');
}

function renderTab(id) {
  if (!dadosGlobais) return;
  var d = dadosGlobais;
  if (id === 'overview')      renderOverview(d);
  if (id === 'receitas')      renderReceitas(d);
  if (id === 'despesas')      renderDespesas(d);
  if (id === 'investimentos') renderInvestimentos(d);
}

// ── RENDER HELPERS ────────────────────────────────────────────────
function kpiHTML(label, value, sub, cor) {
  var accent = cor+'25';
  return '<div class="kpi" style="--accent:'+accent+';--accent-text:'+cor+'">' +
    '<div class="kpi-label">'+label+'</div>' +
    '<div class="kpi-value">'+value+'</div>' +
    (sub ? '<div class="kpi-sub">'+sub+'</div>' : '') +
    '</div>';
}

function progHTML(label, real, plan) {
  var p = pct(real, plan);
  var c = corProg(real, plan);
  var metaStr = plan > 0 ? 'Meta: '+brl(plan) : 'Não planejado';
  var pctStr  = plan > 0 ? p+'%' : 'extra';
  return '<div class="prog">' +
    '<div class="prog-header"><span class="prog-label">'+label+'</span><span class="prog-value">'+brl(real)+'</span></div>' +
    '<div class="prog-track"><div class="prog-fill" style="width:'+p+'%;background:'+c+'"></div></div>' +
    '<div class="prog-footer"><span class="prog-meta">'+metaStr+'</span><span class="prog-meta">'+pctStr+'</span></div>' +
    '</div>';
}

function txHTML(data, desc, cat, valor, cor) {
  return '<div class="tx">' +
    '<div class="tx-top"><span class="tx-desc">'+desc+'</span><span class="tx-val" style="color:'+cor+'">'+brl(valor)+'</span></div>' +
    '<div class="tx-bottom"><span class="badge" style="background:'+cor+'22;color:'+cor+'">'+cat+'</span><span class="tx-date">'+data+'</span></div>' +
    '</div>';
}

function erroHTML(msg, detalhe) {
  return '<div class="erro"><p>⚠️ '+msg+'</p>'+(detalhe?'<code>'+detalhe+'</code>':'')+'</div>';
}

function renderErroURL() {
  el('tab-overview').innerHTML =
    '<div class="erro">' +
    '<p>⚠️ URL do Apps Script não configurada.</p>' +
    '<p style="font-size:11px;color:var(--mid);margin-top:8px;line-height:1.6">Siga as instruções no arquivo <strong>LEIA-ME</strong> para gerar a URL e cole no lugar de <code>COLE_SUA_URL_AQUI</code>.</p>' +
    '</div>';
}

// ── OVERVIEW ─────────────────────────────────────────────────────
function renderOverview(d) {
  var r  = d.resumo;
  var resultado = (r.receita_real||0) - (r.despesa_real||0);
  var efRec = pct(r.receita_real, r.receita_planejada);

  var alertas = [
    { icon:'🔴', t:'Gap de Receita', m:'Apenas '+efRec+'% da meta realizado. Faltam '+brl((r.receita_planejada||0)-(r.receita_real||0))+'.', bg:'#EF444418' },
    { icon:'🟡', t:'TCV Zerado',     m:'TCV de R$7.500 planejado não foi realizado. Principal gap do mês.', bg:'#F59E0B18' },
    { icon:'🟢', t:'Despesas OK',    m:pct(r.despesa_real,r.despesa_planejada)+'% do orçado utilizado. Folha abaixo do previsto.', bg:'#22C55E18' },
  ];

  var html = '<div class="kpi-grid">' +
    kpiHTML('Receita Real',   brl(r.receita_real),  'Meta: '+brl(r.receita_planejada), efRec>=50?'#22C55E':'#EF4444') +
    kpiHTML('Despesas Reais', brl(r.despesa_real),  'Orçado: '+brl(r.despesa_planejada), r.despesa_real<=r.despesa_planejada?'#22C55E':'#EF4444') +
    kpiHTML('Resultado',      brl(resultado),       'Receita − Despesas', resultado>=0?'#22C55E':'#EF4444') +
    kpiHTML('Saldo Final',    brl(r.saldo_final),   'Caixa atual', (r.saldo_final||0)>=0?'#22C55E':'#EF4444') +
    '</div>' +
    '<div class="card"><div class="sec">Receita — Planejado vs Real</div><div class="chart-wrap"><canvas id="chart-rec-bar" height="200"></canvas></div>' +
    '<div class="legend"><div class="legend-item"><div class="legend-dot" style="background:#334155"></div><span class="legend-label">Planejado</span></div><div class="legend-item"><div class="legend-dot" style="background:#22C55E"></div><span class="legend-label">Real</span></div></div></div>' +
    '<div class="card"><div class="sec">Composição das Despesas</div><div class="chart-wrap"><canvas id="chart-desp-pie" height="220"></canvas></div></div>' +
    '<div class="card"><div class="sec">⚡ Alertas &amp; Insights</div>' +
    alertas.map(function(a){ return '<div class="alert" style="background:'+a.bg+'"><div class="alert-title">'+a.icon+' '+a.t+'</div><div class="alert-msg">'+a.m+'</div></div>'; }).join('') +
    '</div>';

  el('tab-overview').innerHTML = html;

  // Gráfico receita
  var recBar = el('chart-rec-bar');
  if (recBar && !charts['rec-bar']) {
    var catRec = r.categorias_receita || [];
    charts['rec-bar'] = new Chart(recBar, {
      type:'bar',
      data:{
        labels: catRec.map(function(c){ return c.nome; }),
        datasets:[
          {label:'Planejado', data:catRec.map(function(c){ return c.planejado; }), backgroundColor:'#334155', borderRadius:5},
          {label:'Real',      data:catRec.map(function(c){ return c.real; }),      backgroundColor:'#22C55E', borderRadius:5},
        ]
      },
      options:chartOpts(false)
    });
  }

  // Pizza despesas
  var despPie = el('chart-desp-pie');
  if (despPie && !charts['desp-pie']) {
    var todas = (r.despesas_fixas||[]).concat(r.despesas_variaveis||[]).filter(function(c){ return c.real>0; });
    charts['desp-pie'] = new Chart(despPie, {
      type:'doughnut',
      data:{
        labels: todas.map(function(c){ return c.nome; }),
        datasets:[{data:todas.map(function(c){ return c.real; }), backgroundColor:PIE_CORES, borderWidth:2, borderColor:'#0F172A'}]
      },
      options:pieOpts()
    });
  }
}

// ── RECEITAS ─────────────────────────────────────────────────────
function renderReceitas(d) {
  var r   = d.resumo;
  var txs = (d.transacoes && d.transacoes.receitas) || [];
  var efRec = pct(r.receita_real, r.receita_planejada);

  var html = '<div class="kpi-grid">' +
    kpiHTML('Meta',        brl(r.receita_planejada),                                        '#94A3B8') +
    kpiHTML('Realizado',   brl(r.receita_real),                                             '#22C55E') +
    kpiHTML('Gap',         brl((r.receita_planejada||0)-(r.receita_real||0)), 'a fechar',   '#EF4444') +
    kpiHTML('Atingimento', efRec+'%',                                         'da meta',    '#F59E0B') +
    '</div>' +
    '<div class="card"><div class="sec">Por Categoria</div>' +
    (r.categorias_receita||[]).map(function(c){ return progHTML(c.nome, c.real, c.planejado); }).join('') +
    '</div>' +
    '<div class="card"><div class="sec">Transações de Receita</div>' +
    (txs.length ? txs.map(function(t){ return txHTML(t.data, t.descricao, t.categoria, t.valor, '#22C55E'); }).join('') : '<div class="empty">Nenhuma transação registrada</div>') +
    '</div>';

  el('tab-receitas').innerHTML = html;
}

// ── DESPESAS ─────────────────────────────────────────────────────
function renderDespesas(d) {
  var r   = d.resumo;
  var txs = (d.transacoes && d.transacoes.despesas) || [];
  var folha = d.folha || [];

  var html = '<div class="kpi-grid">' +
    kpiHTML('Orçado',     brl(r.despesa_planejada),                                                    '#94A3B8') +
    kpiHTML('Gasto',      brl(r.despesa_real), '',                                                      r.despesa_real<=r.despesa_planejada?'#22C55E':'#EF4444') +
    kpiHTML('Economia',   brl((r.despesa_planejada||0)-(r.despesa_real||0)), 'vs orçado',               '#22C55E') +
    kpiHTML('Utilização', pct(r.despesa_real,r.despesa_planejada)+'%', '',                              '#F59E0B') +
    '</div>' +
    '<div class="card"><div class="sec">Despesas Fixas</div>' +
    (r.despesas_fixas||[]).map(function(c){ return progHTML(c.nome, c.real, c.planejado); }).join('') +
    '</div>' +
    '<div class="card"><div class="sec">Despesas Variáveis</div>' +
    (r.despesas_variaveis||[]).length ?
      (r.despesas_variaveis||[]).map(function(c){ return progHTML(c.nome, c.real, c.planejado); }).join('') :
      '<div class="empty">Sem despesas variáveis</div>' +
    '</div>' +
    '<div class="card"><div class="sec">Comparativo Geral</div><div class="chart-wrap"><canvas id="chart-desp-bar" height="220"></canvas></div>' +
    '<div class="legend"><div class="legend-item"><div class="legend-dot" style="background:#334155"></div><span class="legend-label">Planejado</span></div><div class="legend-item"><div class="legend-dot" style="background:#22C55E"></div><span class="legend-label">Real</span></div></div></div>' +
    '<div class="card"><div class="sec">Transações de Despesa</div>' +
    (txs.length ? txs.map(function(t){ return txHTML(t.data, t.descricao, t.categoria, t.valor, '#EF4444'); }).join('') : '<div class="empty">Nenhuma transação registrada</div>') +
    '</div>' +
    '<div class="card"><div class="sec">Folha de Pagamento</div>' +
    (folha.length ? folha.map(function(p){ return '<div class="folha-item"><div><div class="folha-nome">'+p.nome+'</div><span class="folha-cargo">'+p.funcao+'</span></div><div class="folha-sal">'+brl(p.salario)+'</div></div>'; }).join('') : '<div class="empty">Sem registros</div>') +
    '</div>';

  el('tab-despesas').innerHTML = html;

  // Gráfico comparativo
  setTimeout(function(){
    var despBar = el('chart-desp-bar');
    if (despBar && !charts['desp-bar']) {
      var todas = (r.despesas_fixas||[]).concat(r.despesas_variaveis||[]).filter(function(c){ return c.planejado>0||c.real>0; });
      charts['desp-bar'] = new Chart(despBar, {
        type:'bar',
        data:{
          labels: todas.map(function(c){ return c.nome; }),
          datasets:[
            {label:'Planejado', data:todas.map(function(c){ return c.planejado; }), backgroundColor:'#334155', borderRadius:4},
            {label:'Real',      data:todas.map(function(c){ return c.real; }),      backgroundColor:'#22C55E', borderRadius:4},
          ]
        },
        options:chartOpts(true)
      });
    }
  }, 50);
}

// ── INVESTIMENTOS ────────────────────────────────────────────────
function renderInvestimentos(d) {
  var r    = d.resumo;
  var itens = r.investimentos || [];
  var total = itens.reduce(function(s,i){ return s+i.valor; }, 0);

  var html = '<div class="kpi-grid">' +
    kpiHTML('Planejado', brl(total),  '',             '#94A3B8') +
    kpiHTML('Realizado', brl(0),      '',             '#F59E0B') +
    kpiHTML('Pendente',  brl(total),  'a executar',   '#F59E0B') +
    kpiHTML('Execução',  '0%',        '',             '#94A3B8') +
    '</div>' +
    '<div class="card"><div class="sec">Itens Planejados</div>' +
    (itens.length ? itens.map(function(item, i){
      var c = PIE_CORES[i%PIE_CORES.length];
      return '<div class="inv-item"><div class="inv-left"><div class="dot" style="background:'+c+'"></div><span class="inv-name">'+item.nome+'</span></div>' +
        '<div class="inv-right"><span class="inv-val" style="color:'+c+'">'+brl(item.valor)+'</span><span class="badge" style="background:#F59E0B20;color:#F59E0B">Pendente</span></div></div>';
    }).join('') : '<div class="empty">Nenhum investimento planejado</div>') +
    '</div>' +
    '<div class="card"><div class="sec">Distribuição</div><div class="chart-wrap"><canvas id="chart-inv-pie" height="220"></canvas></div></div>';

  el('tab-investimentos').innerHTML = html;

  setTimeout(function(){
    var invPie = el('chart-inv-pie');
    if (invPie && !charts['inv-pie'] && itens.length) {
      charts['inv-pie'] = new Chart(invPie, {
        type:'doughnut',
        data:{
          labels: itens.map(function(i){ return i.nome; }),
          datasets:[{data:itens.map(function(i){ return i.valor; }), backgroundColor:PIE_CORES, borderWidth:2, borderColor:'#0F172A'}]
        },
        options:pieOpts()
      });
    }
  }, 50);
}

// ── CHART OPTIONS ────────────────────────────────────────────────
function chartOpts(rotateX) {
  return {
    responsive:true, maintainAspectRatio:true,
    plugins:{
      legend:{display:false},
      tooltip:{callbacks:{label:function(ctx){ return brl(ctx.raw); }}}
    },
    scales:{
      x:{grid:{color:'#1E293B'}, ticks:{color:'#475569', font:{size:9}, maxRotation: rotateX?30:0}},
      y:{grid:{color:'#1E293B'}, ticks:{color:'#475569', font:{size:9}, callback:function(v){ return 'R$'+(v/1000)+'k'; }}}
    }
  };
}
function pieOpts() {
  return {
    responsive:true, maintainAspectRatio:true, cutout:'50%',
    plugins:{
      legend:{position:'bottom', labels:{color:'#94A3B8', font:{size:10}, boxWidth:10, padding:10}},
      tooltip:{callbacks:{label:function(ctx){ return ctx.label+': '+brl(ctx.raw); }}}
    }
  };
}

// ── INIT ─────────────────────────────────────────────────────────
carregarDados();
setInterval(carregarDados, INTERVALO);
</script>
</body>
</html>
